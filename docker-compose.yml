services:
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: ipcam-mediamtx
    restart: always
    ports:
      - "8554:8554" # RTSP (útil para testar com VLC/ffplay diretamente)
      - "8889:8889" # WebRTC
      # A porta 8888 (HLS) NÃO é publicada: o frontend acessa o HLS através
      # do proxy /hls do backend (ver backend/src/app.ts), não diretamente.
      # As portas 9997 (Control API) e 9996 (Playback API) também NÃO são
      # publicadas para o host/LAN de propósito: são de administração e
      # ficam acessíveis apenas dentro da rede interna do Docker (usadas
      # pelo backend).
    volumes:
      - ./backend/mediamtx.yml:/mediamtx.yml:ro
      - ./recordings:/recordings

  backend:
    image: celsoenssure/opendvr:latest
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ipcam-backend
    restart: always
    depends_on:
      - mediamtx
    ports:
      - "4000:4000"
      # Optional local HTTPS listener (see HTTPS_CERT_FILE/HTTPS_KEY_FILE
      # below) - only needed for browser Push notifications to work when
      # accessing over a LAN IP instead of localhost (the Push API requires
      # a secure context). Harmless to leave published even if unused.
      - "${HTTPS_PORT:-4443}:${HTTPS_PORT:-4443}"
      # VLC RTSP compatibility relay ports (media/vlcRelay.ts) - only needed
      # published to the host for manual testing (e.g. opening
      # rtsp://localhost:9500/relay directly in VLC); MediaMTX reaches them
      # over the internal docker network regardless of this.
      - "9500-9510:9500-9510"
    environment:
      PORT: 4000
      NODE_ENV: production
      # Used both for the daily 03:00 retention cron (jobs/retentionCleanup.ts)
      # and for human-readable timestamps in notification messages
      # (notifications/webhooks.ts) - without this, Node defaults to UTC,
      # which is 3h ahead of Brazil time.
      TZ: ${TZ:-America/Sao_Paulo}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      # Login session lifetime (see backend/src/api/routes/auth.routes.ts).
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      # Optional local HTTPS (see backend/src/index.ts) - only needed to
      # unlock browser Push notifications on a LAN IP (HTTPS or localhost
      # only). Generate a cert trusted by your own devices with mkcert
      # (see docs/configuration.md), then set these two to point at it and
      # mount the files below. Leave both unset (default) to skip this
      # entirely - HTTP-only behavior is unchanged.
      HTTPS_PORT: ${HTTPS_PORT:-4443}
      HTTPS_CERT_FILE: ${HTTPS_CERT_FILE:-}
      HTTPS_KEY_FILE: ${HTTPS_KEY_FILE:-}
      # Only set to "true" if this is deployed behind HTTPS (e.g. a reverse
      # proxy terminating TLS) - see auth/token.ts for why this defaults off
      # (plain-HTTP LAN access is the common case for this app).
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      DATA_DIR: /data
      RECORDINGS_DIR: /recordings
      SNAPSHOTS_DIR: /data/snapshots
      DB_FILE: /data/ipcam.db
      MEDIAMTX_API_URL: http://mediamtx:9997
      MEDIAMTX_RTSP_URL: rtsp://mediamtx:8554
      MEDIAMTX_HLS_URL: http://mediamtx:8888
      MEDIAMTX_PLAYBACK_URL: http://mediamtx:9996
      # Hostname MediaMTX uses to reach this backend's VLC RTSP compatibility
      # relay processes (see backend/src/media/vlcRelay.ts) - the service
      # name below, since they're on the same docker-compose network.
      VLC_RELAY_HOST: backend
      # Optional external notifications on motion/tamper events (see
      # backend/src/notifications/*.ts) - set these in a .env file at the
      # repo root to enable; leave unset to disable a channel. All are also
      # editable at runtime from the Settings page (takes precedence).
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      GENERIC_WEBHOOK_URL: ${GENERIC_WEBHOOK_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_TO: ${EMAIL_TO:-}
      # Web Push (browser/PWA push notifications, see backend/src/lib/webPush.ts).
      # Optional: leave unset and a VAPID key pair is generated automatically
      # on first use and persisted in the database (./app-data volume) - no
      # manual `web-push generate-vapid-keys` step needed. Only set these to
      # pin a specific identity (e.g. restoring to a fresh app-data volume).
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      # Optional AI computer vision (object detection/face recognition, see
      # backend/src/media/visionWorker.ts). Face detection/recognition
      # models (YuNet/SFace) are baked into the image and auto-seeded into
      # ./app-data/models on first boot (see backend/Dockerfile's
      # "ai-models" stage + docker-entrypoint.sh) - nothing to do for those.
      # YOLO object detection is NOT bundled (its weights are AGPL-3.0
      # licensed - see docs/configuration.md) and must be downloaded
      # manually into ./app-data/models for that one feature. Leave
      # unset/missing and the corresponding feature simply stays inactive
      # (both are opt-in per camera in the camera form).
      VISION_YOLO_MODEL_PATH: ${VISION_YOLO_MODEL_PATH:-}
      VISION_FACE_DETECT_MODEL_PATH: ${VISION_FACE_DETECT_MODEL_PATH:-}
      VISION_FACE_RECOGNIZE_MODEL_PATH: ${VISION_FACE_RECOGNIZE_MODEL_PATH:-}
      # Optional VLM auto-captioning (item 4, see
      # backend/src/notifications/captioning.ts and media/llamaCppBridge.ts) -
      # "external" (default) calls any OpenAI-compatible vision endpoint you
      # configure (hosted API, a remote Ollama/LM Studio instance, or the
      # optional `llamacpp-gpu` service below if you have an NVIDIA GPU).
      # "local" instead spawns/manages a CPU-only llama.cpp server IN this
      # container (see Dockerfile), running a small GGUF vision model (e.g.
      # SmolVLM-500M) you download yourself into ./app-data/models/llm/ (see
      # docs/configuration.md). All of this - including provider choice - is
      # also fully editable at runtime from the Settings page (takes
      # precedence over these env vars).
      CAPTIONING_PROVIDER: ${CAPTIONING_PROVIDER:-external}
      CAPTIONING_ENDPOINT: ${CAPTIONING_ENDPOINT:-}
      CAPTIONING_API_KEY: ${CAPTIONING_API_KEY:-}
      CAPTIONING_MODEL: ${CAPTIONING_MODEL:-}
      CAPTIONING_LOCAL_MODEL_PATH: ${CAPTIONING_LOCAL_MODEL_PATH:-}
      CAPTIONING_LOCAL_MMPROJ_PATH: ${CAPTIONING_LOCAL_MMPROJ_PATH:-}
      # "cpu" (default, always works - see the bundled llama-server binary in
      # Dockerfile) or "gpu". Real GPU acceleration can't run inside THIS
      # (Alpine/musl) container at all - CUDA requires glibc and NVIDIA's
      # userspace driver libs, neither available here. For GPU, run the
      # separate optional `llamacpp-gpu` service below instead (official
      # CUDA-enabled llama.cpp image) and set provider to "external" pointing
      # at it - this "local"/"gpu" combination is only for advanced setups
      # where you supply your own GPU-capable binary + matching CUDA
      # runtime libs via a custom LLAMACPP_SERVER_PATH (rare, not supported
      # out of the box).
      CAPTIONING_LOCAL_ACCELERATION: ${CAPTIONING_LOCAL_ACCELERATION:-cpu}
      CAPTIONING_LOCAL_THREADS: ${CAPTIONING_LOCAL_THREADS:-2}
      CAPTIONING_LOCAL_GPU_LAYERS: ${CAPTIONING_LOCAL_GPU_LAYERS:-0}
      CAPTIONING_LOCAL_CONTEXT_SIZE: ${CAPTIONING_LOCAL_CONTEXT_SIZE:-2048}
      CAPTIONING_LOCAL_PORT: ${CAPTIONING_LOCAL_PORT:-8090}
      # Override only if using a different (e.g. GPU-capable) llama-server
      # binary than the CPU-only one built into this image by default.
      LLAMACPP_SERVER_PATH: ${LLAMACPP_SERVER_PATH:-}
    volumes:
      - ./app-data:/data
      - ./recordings:/recordings
      # Mounts your mkcert-generated cert/key (see docs/configuration.md)
      # read-only into the container, at the paths HTTPS_CERT_FILE/
      # HTTPS_KEY_FILE point to above. Only takes effect if you actually
      # set those two env vars and this file exists on the host -
      # otherwise this volume line is simply unused.
      - ./certs:/certs:ro

  # Optional GPU-accelerated captioning (item 4) - runs the OFFICIAL
  # llama.cpp CUDA-enabled server image as a SEPARATE container, entirely
  # independent of the (Alpine/CPU-only) backend image above - no rebuild,
  # no risk to it. Requires an NVIDIA GPU + the NVIDIA Container Toolkit
  # (https://github.com/NVIDIA/nvidia-container-toolkit) installed on the
  # host. Not started by `docker compose up` by default - opt in with:
  #   docker compose --profile gpu up -d
  # Then, in Settings -> "Legenda automática", set Provider = "Externo",
  # Endpoint = http://llamacpp-gpu:8080/v1, Model = (any non-empty value).
  #
  # Requires downloading the same 2 GGUF files as the CPU "local" provider
  # (model + mmproj, e.g. SmolVLM-500M) into ./app-data/models/llm/ first -
  # see docs/configuration.md. Check the llama.cpp docs for the current
  # image tag/flags before relying on this - both move fast.
  llamacpp-gpu:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: ipcam-llamacpp-gpu
    restart: unless-stopped
    profiles: ["gpu"]
    command: >
      -m /models/SmolVLM-500M-Instruct-Q8_0.gguf
      --mmproj /models/mmproj-SmolVLM-500M-Instruct-Q8_0.gguf
      --host 0.0.0.0 --port 8080 -c 2048 --n-gpu-layers 99
    volumes:
      - ./app-data/models/llm:/models:ro
    # Internal-network only (reached by the backend at
    # http://llamacpp-gpu:8080), never published to the host/LAN.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
