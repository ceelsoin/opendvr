name: CI/CD

# Runs the full test suite (backend + frontend) on every push/PR, and only
# builds + pushes the multi-arch Docker image once tests pass on master/main
# or a version tag. Never pushes an image for pull requests - only tests run
# there.
#
# The multi-arch build/push (amd64+arm64, equivalent to `make release` in
# the root Makefile for local/manual releases) is split into a `build`
# matrix job (one native runner per platform, each pushing by digest with
# GitHub Actions layer caching) and a `release` job that merges the two
# digests into the final multi-arch tags. This replaced a single job that
# QEMU-emulated the arm64 half and never cached any layers - originally
# needed because backend/Dockerfile used to compile llama.cpp from source
# (over an hour per build). That's since been removed entirely in favor of
# the official prebuilt `llamacpp-cpu`/`llamacpp-gpu` sidecar images (see
# docker-compose.yml), but the native-runner + caching setup here is kept
# since it still speeds up every other build stage.
on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # clipRenderer.test.ts spawns a real ffmpeg to exercise drawDetectionsOnClip
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        working-directory: backend
        run: npm install

      - name: Run tests
        working-directory: backend
        run: npm test

      - name: Typecheck + build
        working-directory: backend
        run: npm run build:backend

  test-frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Run tests
        working-directory: frontend
        run: npm test

      - name: Typecheck + build
        working-directory: frontend
        run: npm run build

  build:
    name: Build image (${{ matrix.platform }})
    needs: [test-backend, test-frontend]
    # Only build once tests pass on master/main or a version tag (e.g.
    # v1.2.0) - pull requests only get the test jobs above.
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          # GitHub-hosted native arm64 runner - avoids QEMU emulation,
          # which is generally much slower for any build step than
          # compiling/running natively (previously most notable for
          # llama.cpp's from-source build, since removed - see
          # docker-compose.yml's llamacpp-cpu/llamacpp-gpu services).
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Sanitize platform name (for cache scope/artifact name)
        id: platform
        run: echo "pair=${PLATFORM/\//-}" >> "$GITHUB_OUTPUT"
        env:
          PLATFORM: ${{ matrix.platform }}

      # Pushes an untagged image identified only by digest - the `release`
      # job below combines the amd64+arm64 digests into the final
      # :latest/:VERSION multi-arch manifest. Layer cache is scoped per
      # platform via the GitHub Actions cache backend, so stages that
      # haven't changed (most notably the llama.cpp compile, which used to
      # rerun from scratch on every single push) are reused instead of
      # rebuilt.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=celsoenssure/opendvr,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ steps.platform.outputs.pair }}
          cache-to: type=gha,mode=max,scope=${{ steps.platform.outputs.pair }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ steps.platform.outputs.pair }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  release:
    name: Push multi-arch manifest
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Pushing a tag like "v1.2.0" also publishes that version number
      # alongside :latest (matches `make release VERSION=1.2.0`'s usage
      # documented in the Makefile). A plain push to master/main only
      # updates :latest.
      - name: Resolve version tag (if pushing a version tag)
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=" >> "$GITHUB_OUTPUT"
          fi

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          tags=(-t celsoenssure/opendvr:latest)
          if [[ -n "${{ steps.version.outputs.value }}" ]]; then
            tags+=(-t "celsoenssure/opendvr:${{ steps.version.outputs.value }}")
          fi
          docker buildx imagetools create "${tags[@]}" \
            $(printf 'celsoenssure/opendvr@sha256:%s ' *)

      - name: Inspect image
        run: docker buildx imagetools inspect celsoenssure/opendvr:latest
